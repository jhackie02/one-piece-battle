<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirate ESL Battle - Master Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary: #ffcc00;
            --primary-glow: rgba(255, 204, 0, 0.6);
            --p1-color: #00d2ff;
            --p2-color: #ff3e3e;
            --glass: rgba(0, 0, 0, 0.85);
            --font-main: 'Balsamiq Sans', 'Comic Sans MS', cursive, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: var(--font-main); }

        body {
            background-color: #0a0a0c;
            color: white;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 56.25vw; /* 16:9 Aspect Ratio */
            max-height: 100vh;
            max-width: 177.78vh;
            background: #111;
            background-size: cover;
            background-position: center;
            overflow: hidden;
            box-shadow: 0 0 100px rgba(0,0,0,1);
        }

        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            background-size: cover;
            background-position: center;
        }
        .screen.active { display: flex; }

        .btn {
            background: linear-gradient(180deg, var(--primary), #e6b800);
            border: 3px solid #fff;
            padding: 12px 30px;
            border-radius: 50px;
            color: #000;
            font-weight: 700;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            box-shadow: 0 6px 0px #997a00;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn:hover { transform: translateY(-3px) scale(1.05); filter: brightness(1.1); }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0px #997a00; }
        .btn-blue { background: linear-gradient(180deg, #00d2ff, #0099cc); box-shadow: 0 6px 0px #006688; color: white; }
        .btn-red { background: linear-gradient(180deg, #ff3e3e, #cc0000); box-shadow: 0 6px 0px #880000; color: white; }

        #battle-hud {
            position: absolute;
            top: 20px;
            width: 90%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        .hp-container { width: 42%; }
        .hp-bar-bg { height: 35px; background: #222; border: 4px solid #fff; border-radius: 20px; overflow: hidden; position: relative; }
        .hp-bar-fill { height: 100%; width: 100%; transition: width 0.4s ease; }
        #p1-hp-fill { background: linear-gradient(90deg, #0066ff, #00d2ff); }
        #p2-hp-fill { background: linear-gradient(270deg, #cc0000, #ff3e3e); }

        .stage {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 60%;
            overflow: hidden;
            z-index: 20;
        }
        .fighter {
            position: absolute;
            bottom: 20px;
            width: 300px;
            height: 100%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: bottom center;
            transition: transform 0.2s, left 0.3s, right 0.3s;
        }
        #fighter-p1 { left: 15%; }
        #fighter-p2 { right: 15%; transform: scaleX(-1); }

        #question-area {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40%;
            background: rgba(0,0,0,0.85);
            border-top: 5px solid var(--primary);
            display: flex;
            padding: 10px;
            gap: 15px;
            z-index: 50;
        }

        .player-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .p1-panel { border-left: 10px solid var(--p1-color); }
        .p2-panel { border-right: 10px solid var(--p2-color); }

        .q-display {
            font-size: 1.1rem;
            text-align: center;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.4);
            border-radius: 15px;
            padding: 10px;
            gap: 15px;
        }
        .q-display img { max-height: 60px; border-radius: 8px; border: 2px solid white; }

        .choices-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            flex: 1;
        }
        .choice-btn {
            background: rgba(255,255,255,0.1);
            border: 2px solid transparent;
            border-radius: 12px;
            display: flex;
            align-items: center;
            padding: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .choice-btn:hover { background: rgba(255,255,255,0.2); border-color: var(--primary); transform: scale(1.02); }
        .choice-btn img { width: 45px; height: 45px; object-fit: cover; border-radius: 8px; margin-right: 10px; }

        #victory-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            backdrop-filter: blur(15px);
            pointer-events: auto;
        }

        .vfx-text {
            position: absolute;
            font-size: 4rem;
            color: yellow;
            font-weight: 900;
            text-shadow: 4px 4px 0 #000;
            z-index: 1000;
            pointer-events: none;
            animation: vfxPop 0.8s forwards;
        }
        @keyframes vfxPop { 0% { opacity: 1; transform: scale(0.5) translateY(0); } 100% { opacity: 0; transform: scale(1.5) translateY(-100px); } }

        .hit { animation: hitShake 0.3s ease-in-out; filter: brightness(2) drop-shadow(0 0 20px red) !important; }
        @keyframes hitShake {
            0%, 100% { transform: translate(0,0); }
            25% { transform: translate(-20px, 10px); }
            50% { transform: translate(20px, -10px); }
            75% { transform: translate(-10px, 5px); }
        }
        .attack-p1 { transform: translateX(150px) scale(1.2) !important; }
        .attack-p2 { transform: scaleX(-1) translateX(150px) scale(1.2) !important; }

        .scrollable { overflow-y: auto; max-height: 80%; width: 100%; padding: 20px; }
        .glass-panel { background: var(--glass); border-radius: 25px; padding: 25px; border: 1px solid rgba(255,255,255,0.1); }
        .editor-card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); }
        
        input[type="text"] { width: 100%; padding: 10px; border-radius: 10px; border: none; margin: 5px 0; font-size: 1rem; color: #000; }
        input[type="range"] { width: 100%; cursor: pointer; }

        /* Notification Toast Styling */
        #notification-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }
        .toast {
            background: rgba(0,0,0,0.9);
            border-left: 5px solid var(--primary);
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            color: #fff;
            font-weight: bold;
            transform: translateX(120%);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: auto;
        }
        .toast.show { transform: translateX(0); }
    </style>
</head>
<body>

<div id="game-container">
    <div id="notification-container"></div>

    <div id="screen-menu" class="screen active" style="justify-content: center;">
        <h1 class="text-6xl md:text-8xl font-black text-yellow-400 mb-12 drop-shadow-lg text-center leading-none" style="text-shadow: 8px 8px 0 #000;">PIRATE BATTLE</h1>
        <div style="display: flex; gap: 20px;">
            <button class="btn" onclick="app.showScreen('screen-mode')">Battle</button>
            <button class="btn btn-blue" onclick="app.showScreen('screen-editor')">Question Editor</button>
            <button class="btn btn-red" onclick="app.showScreen('screen-settings')">Settings</button>
        </div>
    </div>

    <div id="screen-mode" class="screen" style="justify-content: center;">
        <h2 style="font-size: 3rem; margin-bottom: 40px; text-shadow: 3px 3px 0 #000;">SELECT MODE</h2>
        <div style="display: flex; gap: 30px;">
            <button class="btn" style="height: 200px; width: 250px; flex-direction: column;" onclick="game.init('solo')">
                <span style="font-size: 2.5rem;">SOLO</span>
                <span class="text-xs opacity-80 mt-2">VS CPU (15 Qs)</span>
            </button>
            <button class="btn btn-red" style="height: 200px; width: 250px; flex-direction: column;" onclick="game.init('team')">
                <span style="font-size: 2.5rem;">TEAM</span>
                <span class="text-xs opacity-80 mt-2">SIMULTANEOUS 1v1 (10 Qs)</span>
            </button>
        </div>
        <button class="btn btn-blue" style="margin-top: 40px;" onclick="app.showScreen('screen-menu')">BACK</button>
    </div>

    <div id="screen-char-select" class="screen">
        <h2 id="char-title" style="margin-top: 30px; font-size: 2.5rem; color: var(--primary); text-shadow: 3px 3px 0 #000;">PLAYER 1: CHOOSE PIRATE</h2>
        <div id="char-grid" style="width: 90%; height: 60%; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; overflow-y: auto; margin-top: 30px; padding: 20px;" class="glass-panel"></div>
        <button class="btn btn-red" style="margin-top: 20px;" onclick="app.showScreen('screen-mode')">CANCEL</button>
    </div>

    <div id="screen-battle" class="screen">
        <div id="battle-hud">
            <div class="hp-container">
                <div id="p1-name" style="font-size: 1.5rem; color: var(--p1-color); font-weight: bold; text-shadow: 2px 2px 0 #000;">PLAYER 1</div>
                <div class="hp-bar-bg"><div id="p1-hp-fill" class="hp-bar-fill"></div></div>
            </div>
            <div style="font-size: 2rem; color: var(--primary); text-shadow: 3px 3px 0 #000;">VS</div>
            <div class="hp-container" style="text-align: right;">
                <div id="p2-name" style="font-size: 1.5rem; color: var(--p2-color); font-weight: bold; text-shadow: 2px 2px 0 #000;">PLAYER 2</div>
                <div class="hp-bar-bg"><div id="p2-hp-fill" class="hp-bar-fill"></div></div>
            </div>
        </div>

        <div class="stage">
            <div id="fighter-p1" class="fighter"></div>
            <div id="fighter-p2" class="fighter"></div>
        </div>

        <div id="question-area">
            <div id="panel-p1" class="player-panel p1-panel">
                <div id="q-text-p1" class="q-display"></div>
                <div id="choices-p1" class="choices-grid"></div>
            </div>
            <div id="panel-p2" class="player-panel p2-panel">
                <div id="q-text-p2" class="q-display"></div>
                <div id="choices-p2" class="choices-grid"></div>
            </div>
        </div>
    </div>

    <div id="screen-editor" class="screen">
        <div class="glass-panel scrollable" style="width: 95%; height: 90%; margin: auto;">
            <div class="flex justify-between items-center mb-6 border-b border-white/20 pb-4">
                <h2 class="text-3xl font-bold">QUESTION BANK</h2>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-blue text-xs py-2 px-4" onclick="storage.exportQuestions()">EXPORT JSON</button>
                    <button class="btn btn-blue text-xs py-2 px-4" onclick="document.getElementById('import-q-file').click()">IMPORT JSON</button>
                    <input type="file" id="import-q-file" style="display:none" accept=".json" onchange="storage.importQuestions(event)">
                    <button class="btn text-xs py-2 px-4" onclick="editor.add()">+ Add Question</button>
                </div>
            </div>
            <div id="editor-container"></div>
            <button class="btn mt-4" onclick="app.showScreen('screen-menu')">BACK TO MENU</button>
        </div>
    </div>

    <div id="screen-settings" class="screen">
        <div class="glass-panel scrollable" style="width: 90%; height: 90%; margin: auto;">
            <h2 class="text-3xl font-bold mb-6 border-b border-white/20 pb-4">GAME SETTINGS</h2>
            <div class="editor-card">
                <h3 class="text-lg font-bold mb-3">Music & Volume</h3>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <label class="text-sm opacity-80">Volume</label>
                    <input type="range" id="vol-slider" min="0" max="1" step="0.1" value="0.5" oninput="audio.updateVolume()">
                    <label class="text-sm opacity-80 mt-2">Upload Background Music (.mp3)</label>
                    <input type="file" accept="audio/*" onchange="audio.uploadBGM(event)">
                </div>
            </div>
            <div class="editor-card">
                <h3 class="text-lg font-bold mb-3">Battle Assets</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="text-sm opacity-80 block mb-1">Menu Background (background1.jpg)</label>
                        <input type="file" onchange="storage.uploadImage(event, 'bgMenu')">
                    </div>
                    <div>
                        <label class="text-sm opacity-80 block mb-1">Battle Background (background2.jpg)</label>
                        <input type="file" onchange="storage.uploadImage(event, 'bgBattle')">
                    </div>
                </div>
                <hr style="margin: 20px 0; opacity: 0.1;">
                <label class="text-sm opacity-80 block mb-1">Bulk Fighter Upload (Max 10 images - PNG/GIF/JPG)</label>
                <input type="file" multiple onchange="storage.uploadCharacters(event)">
                <div id="settings-char-list" style="display:flex; flex-wrap:wrap; gap:10px; margin-top:15px;"></div>
            </div>
            <div style="display: flex; gap: 15px;" class="mb-6">
                <button class="btn btn-blue" onclick="storage.exportJSON()">EXPORT ALL BACKUP</button>
                <button class="btn btn-blue" onclick="document.getElementById('import-full-file').click()">IMPORT ALL BACKUP</button>
                <input type="file" id="import-full-file" style="display:none" onchange="storage.importFullJSON(event)">
            </div>
            <button class="btn" onclick="app.showScreen('screen-menu')">BACK</button>
        </div>
    </div>

    <div id="victory-overlay">
        <h1 id="victory-title" style="font-size: 8rem; color: var(--primary); text-shadow: 0 0 50px gold; pointer-events: none;">KO!</h1>
        <h2 id="victory-name" style="font-size: 3.5rem; margin-bottom: 20px; pointer-events: none;">PLAYER WINS!</h2>
        <div id="victory-img" style="width: 250px; height: 250px; background-size: contain; background-repeat: no-repeat; margin-bottom: 40px; pointer-events: none;"></div>
        <div style="display: flex; gap: 20px; z-index: 3000; pointer-events: auto;">
            <button class="btn" onclick="game.restart()">REMATCH</button>
            <button class="btn btn-blue" onclick="app.showScreen('screen-menu')">MAIN MENU</button>
        </div>
    </div>
</div>

<script>
    const DB_NAME = "PirateBattleESL_DB";
    const DB_VERSION = 1;
    let db;

    // Default configuration structure mapping exactly to what should load automatically
    // if local files are present inside the respective folders.
    let appData = {
        chars: [
            { id: 1, name: "Monkey D. Luffy", img: "Luffy.gif" },
            { id: 2, name: "Roronoa Zoro", img: "Zoro.gif" },
            { id: 3, name: "Nami", img: "Nami.gif" },
            { id: 4, name: "Sanji", img: "Sanji.gif" },
            { id: 5, name: "Usopp", img: "Usopp.gif" },
            { id: 6, name: "Chopper", img: "Chopper.gif" },
            { id: 7, name: "Robin", img: "Robin.gif"},
            { id: 8, name: "Franky", img: "Franky.gif"}, 
            { id: 9, name: "Brook", img: "Brook.gif"}, 
            { id: 10, name: "Jimbei", img: "jimbei.gif"}
        ],
        questions: {
            p1: [
                { q: "Is he a pirate?", qImg: "", choices: ["Yes, he is.", "No, he isn't.", "Yes, she is.", "No, she isn't."], correct: 0 }
            ],
            p2: [
                { q: "Is he a pirate?", qImg: "", choices: ["Yes, he is.", "No, he isn't.", "Yes, she is.", "No, she isn't."], correct: 0 }
            ]
        },
        settings: {
            bgMenu: "background1.jpg",
            bgBattle: "background2.jpg",
            vol: 0.5,
            hp: 100,
            dmg: 10
        }
    };

    // UI Toast System to avoid browser blockages (never use alert())
    function notify(message, duration = 3000) {
        const container = document.getElementById('notification-container');
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerText = message;
        container.appendChild(toast);
        setTimeout(() => toast.classList.add('show'), 10);
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.remove(), 300);
        }, duration);
    }

    // --- INDEXEDDB IMPLEMENTATION FOR OFFLINE persistence & high limit storage ---
    function initDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, DB_VERSION);
            request.onerror = (e) => reject(e);
            request.onsuccess = (e) => {
                db = e.target.result;
                resolve();
            };
            request.onupgradeneeded = (e) => {
                db = e.target.result;
                if (!db.objectStoreNames.contains("stateStore")) {
                    db.createObjectStore("stateStore");
                }
            };
        });
    }

    function saveStateToDB() {
        return new Promise((resolve, reject) => {
            if (!db) return reject("No DB instance");
            const transaction = db.transaction(["stateStore"], "readwrite");
            const store = transaction.objectStore("stateStore");
            const request = store.put(appData, "gameData");
            request.onsuccess = () => resolve();
            request.onerror = (e) => reject(e);
        });
    }

    function loadStateFromDB() {
        return new Promise((resolve, reject) => {
            if (!db) return reject("No DB instance");
            const transaction = db.transaction(["stateStore"], "readonly");
            const store = transaction.objectStore("stateStore");
            const request = store.get("gameData");
            request.onsuccess = (e) => {
                if (request.result) {
                    appData = request.result;
                }
                resolve();
            };
            request.onerror = (e) => reject(e);
        });
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const bgm = new Audio();
    bgm.loop = true;

    const audio = {
        playSfx(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            gain.gain.value = appData.settings.vol * 0.4;

            if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'win') {
                const now = audioCtx.currentTime;
                [440, 554, 659, 880].forEach((freq, idx) => {
                    const oscNote = audioCtx.createOscillator();
                    const gainNote = audioCtx.createGain();
                    oscNote.connect(gainNote);
                    gainNote.connect(audioCtx.destination);
                    oscNote.frequency.value = freq;
                    gainNote.gain.setValueAtTime(appData.settings.vol * 0.2, now + idx * 0.12);
                    gainNote.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.12 + 0.4);
                    oscNote.start(now + idx * 0.12);
                    oscNote.stop(now + idx * 0.12 + 0.5);
                });
            } else if (type === 'wrong') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.setValueAtTime(90, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        },
        updateVolume() {
            appData.settings.vol = parseFloat(document.getElementById('vol-slider').value);
            bgm.volume = appData.settings.vol;
            saveStateToDB();
        },
        uploadBGM(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (ev) => {
                bgm.src = ev.target.result;
                bgm.play().catch(() => {});
                notify("BGM loaded successfully!");
            };
            reader.readAsDataURL(file);
        },
        autoLoadBGM() {
            // Check if default relative file is available (bgm.mp3)
            bgm.src = "bgm.mp3";
            bgm.volume = appData.settings.vol;
            // Attempt autoplay on first user interaction to bypass browser guardrails
            document.body.addEventListener('click', () => {
                if (bgm.paused) {
                    bgm.play().catch(e => console.log("Silent fallback, music requires manual upload"));
                }
            }, { once: true });
        }
    };

    const storage = {
        exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "pirate_battle_full_backup.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        },
        importFullJSON(e) {
            const reader = new FileReader();
            reader.onload = async (ev) => {
                try {
                    appData = JSON.parse(ev.target.result);
                    await saveStateToDB();
                    notify("Full Backup Imported Successfully!");
                    app.showScreen('screen-menu');
                } catch (err) {
                    notify("Invalid Backup File");
                }
            };
            reader.readAsText(e.target.files[0]);
        },
        exportQuestions() {
            const data = JSON.stringify(appData.questions, null, 2);
            const blob = new Blob([data], { type: "application/json;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "questions.json";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        },
        importQuestions(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    if (Array.isArray(data)) {
                        // Upgrade old schema questions array to new structure
                        appData.questions = { p1: data, p2: JSON.parse(JSON.stringify(data)) };
                    } else if (data.p1 && data.p2) {
                        appData.questions = data;
                    } else {
                        throw new Error();
                    }
                    await saveStateToDB();
                    notify("Questions loaded!");
                    editor.render();
                } catch (err) {
                    notify("Incompatible format! Ensure JSON contains the standard schema.");
                }
            };
            reader.readAsText(file);
        },
        async uploadImage(e, key) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (ev) => {
                appData.settings[key] = ev.target.result;
                await saveStateToDB();
                notify("Background customized successfully!");
            };
            reader.readAsDataURL(file);
        },
        uploadCharacters(e) {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;
            let loaded = 0;
            files.forEach(f => {
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    if (appData.chars.length >= 10) {
                        notify("Maximum character slots filled (10 limit)");
                        return;
                    }
                    appData.chars.push({
                        id: Date.now() + Math.random(),
                        name: f.name.split('.')[0].toUpperCase(),
                        img: ev.target.result
                    });
                    loaded++;
                    if (loaded === files.length) {
                        await saveStateToDB();
                        notify("Fighters loaded into system!");
                        app.renderSettingsChars();
                    }
                };
                reader.readAsDataURL(f);
            });
        }
    };

    const game = {
        mode: 'solo', p1: null, p2: null, hp1: 100, hp2: 100, active: false,
        shuffledP1: [], shuffledP2: [],
        p1Idx: 0, p2Idx: 0,
        maxQ: 15,

        init(mode) {
            this.mode = mode;
            this.p1 = null;
            this.p2 = null;
            this.maxQ = (mode === 'solo') ? 15 : 10;
            app.renderCharGrid();
            app.showScreen('screen-char-select');
            document.getElementById('char-title').innerText = "PLAYER 1: CHOOSE PIRATE";
        },
        selectChar(char) {
            if (!this.p1) {
                this.p1 = char;
                if (this.mode === 'solo') {
                    const others = appData.chars.filter(c => c.id !== char.id);
                    this.p2 = others.length ? others[Math.floor(Math.random()*others.length)] : char;
                    this.start();
                } else {
                    document.getElementById('char-title').innerText = "PLAYER 2: CHOOSE PIRATE";
                    app.renderCharGrid();
                }
            } else {
                if (char.id === this.p1.id) {
                    notify("Duplicate character! Choose a different fighter.");
                    return;
                }
                this.p2 = char;
                this.start();
            }
        },
        start() {
            this.hp1 = appData.settings.hp;
            this.hp2 = appData.settings.hp;
            this.active = true;
            this.p1Idx = 0;
            this.p2Idx = 0;

            // Prepare questions (Solo only uses p1, Team uses both separate pools)
            const p1Bank = appData.questions.p1 || [];
            const p2Bank = appData.questions.p2 || p1Bank;

            if (p1Bank.length === 0) {
                notify("Warning: Question Bank is empty! Create questions first.");
                app.showScreen('screen-editor');
                return;
            }

            this.shuffledP1 = [...p1Bank].sort(() => Math.random() - 0.5);
            this.shuffledP2 = [...p2Bank].sort(() => Math.random() - 0.5);

            document.getElementById('p1-name').innerText = this.p1.name;
            document.getElementById('p2-name').innerText = this.p2.name;
            
            // Set sprites and fallback cleanly
            document.getElementById('fighter-p1').style.backgroundImage = `url(${this.p1.img})`;
            document.getElementById('fighter-p2').style.backgroundImage = `url(${this.p2.img})`;

            document.getElementById('panel-p2').style.display = this.mode === 'team' ? 'flex' : 'none';
            document.getElementById('victory-overlay').style.display = 'none';

            app.showScreen('screen-battle');
            this.updateUI();
            this.nextQ(1);
            if (this.mode === 'team') this.nextQ(2);
        },
        nextQ(player) {
            if (!this.active) return;
            const idx = (player === 1) ? this.p1Idx : this.p2Idx;
            
            // Check limits for Solo vs Team
            if (this.mode === 'solo' && this.p1Idx >= this.maxQ) {
                this.end();
                return;
            }
            if (this.mode === 'team' && (this.p1Idx >= this.maxQ || this.p2Idx >= this.maxQ)) {
                this.end();
                return;
            }

            const bank = (player === 1) ? this.shuffledP1 : this.shuffledP2;
            const q = bank[idx % bank.length];
            app.renderQuestion(player, q);
        },
        answer(player, isCorrect) {
            if (!this.active) return;
            const attacker = document.getElementById(`fighter-p${player}`);
            const defender = document.getElementById(`fighter-p${player === 1 ? 2 : 1}`);
            const dmgVal = appData.settings.dmg;

            if (isCorrect) {
                audio.playSfx('hit');
                attacker.classList.add(player === 1 ? 'attack-p1' : 'attack-p2');
                app.spawnVFX(player === 1 ? '70%' : '30%', "CRITICAL HIT!");
                setTimeout(() => {
                    attacker.classList.remove(player === 1 ? 'attack-p1' : 'attack-p2');
                    defender.classList.add('hit');
                    if (player === 1) this.hp2 = Math.max(0, this.hp2 - dmgVal);
                    else this.hp1 = Math.max(0, this.hp1 - dmgVal);
                    this.updateUI();
                    setTimeout(() => {
                        defender.classList.remove('hit');
                        if (this.hp1 <= 0 || this.hp2 <= 0) this.end();
                        else this.nextQ(player);
                    }, 300);
                }, 200);
            } else {
                audio.playSfx('wrong');
                attacker.classList.add('hit');
                // Wrong answer hurts the self
                if (player === 1) this.hp1 = Math.max(0, this.hp1 - dmgVal);
                else this.hp2 = Math.max(0, this.hp2 - dmgVal);
                this.updateUI();
                setTimeout(() => {
                    attacker.classList.remove('hit');
                    if (this.hp1 <= 0 || this.hp2 <= 0) this.end();
                    else this.nextQ(player);
                }, 300);
            }

            if (player === 1) this.p1Idx++; else this.p2Idx++;
        },
        updateUI() {
            document.getElementById('p1-hp-fill').style.width = `${(this.hp1 / appData.settings.hp) * 100}%`;
            document.getElementById('p2-hp-fill').style.width = `${(this.hp2 / appData.settings.hp) * 100}%`;
        },
        end() {
            this.active = false;
            audio.playSfx('win');
            
            let winner;
            if (this.hp1 > this.hp2) {
                winner = this.p1;
            } else if (this.hp2 > this.hp1) {
                winner = this.p2;
            } else {
                winner = { name: "DRAW MATCH", img: "https://placehold.co/200x200?text=DRAW" };
            }

            document.getElementById('victory-name').innerText = (winner.name === "DRAW MATCH") ? "DRAW MATCH!" : `${winner.name} WINS!`;
            document.getElementById('victory-img').style.backgroundImage = `url(${winner.img})`;
            document.getElementById('victory-overlay').style.display = 'flex';
        },
        restart() {
            this.start();
        }
    };

    const app = {
        showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            const target = document.getElementById(id);
            target.classList.add('active');

            // Apply responsive automatic background configuration
            const bg = (id === 'screen-battle') ? appData.settings.bgBattle : appData.settings.bgMenu;
            document.getElementById('game-container').style.backgroundImage = `url(${bg})`;

            if (id === 'screen-editor') editor.render();
            if (id === 'screen-settings') this.renderSettingsChars();
            if (id !== 'screen-battle') document.getElementById('victory-overlay').style.display = 'none';
        },
        renderCharGrid() {
            const grid = document.getElementById('char-grid');
            grid.innerHTML = '';
            appData.chars.forEach(c => {
                const d = document.createElement('div');
                d.className = 'btn flex-col p-4 w-full h-[180px] bg-white/5 border border-white/10 hover:border-yellow-400';
                d.innerHTML = `<img src="${c.img}" onerror="this.src='https://placehold.co/100?text=PIRATE'" style="height:110px; object-fit:contain;" class="mb-2"><span>${c.name}</span>`;
                d.onclick = () => game.selectChar(c);
                grid.appendChild(d);
            });
        },
        renderQuestion(p, q) {
            const head = document.getElementById(`q-text-p${p}`);
            const grid = document.getElementById(`choices-p${p}`);
            
            // Build question visual assets
            head.innerHTML = q.qImg ? `<img src="${q.qImg}" class="max-h-[60px] mr-2"><span>${q.q}</span>` : `<span>${q.q}</span>`;
            grid.innerHTML = '';

            // Map and safely randomize choice layout sequence
            const indexes = [0, 1, 2, 3].slice(0, q.choices.length);
            indexes.sort(() => Math.random() - 0.5);

            indexes.forEach(idx => {
                const b = document.createElement('div');
                b.className = 'choice-btn';
                const hasImg = q.imgs && q.imgs[idx];
                b.innerHTML = hasImg ? `<img src="${q.imgs[idx]}" onerror="this.style.display='none'"><span>${q.choices[idx]}</span>` : `<span>${q.choices[idx]}</span>`;
                b.onclick = () => game.answer(p, idx === q.correct);
                grid.appendChild(b);
            });
        },
        spawnVFX(left, txt) {
            const d = document.createElement('div');
            d.className = 'vfx-text';
            d.innerText = txt;
            d.style.left = left;
            d.style.top = '40%';
            document.getElementById('game-container').appendChild(d);
            setTimeout(() => d.remove(), 800);
        },
        renderSettingsChars() {
            const list = document.getElementById('settings-char-list');
            list.innerHTML = '';
            appData.chars.forEach((c, idx) => {
                const d = document.createElement('div');
                d.className = "text-center p-2 bg-white/5 rounded-lg border border-white/10";
                d.innerHTML = `
                    <img src="${c.img}" onerror="this.src='https://placehold.co/100?text=PIRATE'" style="width:60px; height:60px; border-radius:5px; object-fit:contain;" class="mb-2 mx-auto">
                    <span class="block text-xs truncate max-w-[80px] mb-2 font-bold">${c.name}</span>
                    <button class="btn btn-red py-1 px-3 text-[10px] shadow-none h-6" onclick="appData.chars.splice(${idx},1); saveStateToDB(); app.renderSettingsChars()">DEL</button>
                `;
                list.appendChild(d);
            });
        }
    };

    const editor = {
        render() {
            const container = document.getElementById('editor-container');
            container.innerHTML = '';
            
            // Render Set A Editor (Sync P1 & P2 logic together for simplified dual set generation)
            const list = appData.questions.p1 || [];
            list.forEach((q, idx) => {
                const card = document.createElement('div');
                card.className = 'editor-card';
                card.innerHTML = `
                    <div style="display:flex; gap:10px; align-items:center;" class="mb-4">
                        <span class="font-bold text-yellow-400">Q${idx+1}:</span>
                        <input type="text" value="${q.q}" placeholder="Question text..." onchange="appData.questions.p1[${idx}].q = this.value; appData.questions.p2[${idx}].q = this.value; saveStateToDB()">
                        <div class="flex items-center gap-2">
                            <span class="text-xs opacity-60">Image:</span>
                            <input type="file" style="width:180px; font-size:10px;" onchange="editor.uploadImg(${idx}, -1, event)">
                        </div>
                    </div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                        ${q.choices.map((c, ci) => `
                            <div style="background:rgba(0,0,0,0.3); padding:10px; border-radius:10px; border: 2px solid ${q.correct === ci ? 'var(--primary)' : 'transparent'}">
                                <input type="text" value="${c}" onchange="appData.questions.p1[${idx}].choices[${ci}] = this.value; appData.questions.p2[${idx}].choices[${ci}] = this.value; saveStateToDB()" class="text-sm">
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:5px;">
                                    <button class="btn py-1 px-3 text-[10px] h-6 shadow-none" onclick="appData.questions.p1[${idx}].correct = ${ci}; appData.questions.p2[${idx}].correct = ${ci}; saveStateToDB(); editor.render()">✓ Correct</button>
                                    <input type="file" style="width:140px; font-size:9px;" onchange="editor.uploadImg(${idx}, ${ci}, event)">
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <button class="btn btn-red mt-4 py-1 px-4 text-xs h-8 shadow-none" onclick="appData.questions.p1.splice(${idx},1); appData.questions.p2.splice(${idx},1); saveStateToDB(); editor.render()">Remove Question</button>
                `;
                container.appendChild(card);
            });
        },
        add() {
            if (!appData.questions.p1) appData.questions.p1 = [];
            if (!appData.questions.p2) appData.questions.p2 = [];
            
            const newQ = { q: "New Question?", qImg: "", choices: ["Option 1","Option 2","Option 3","Option 4"], imgs: ["","","",""], correct: 0 };
            appData.questions.p1.push(newQ);
            appData.questions.p2.push(JSON.parse(JSON.stringify(newQ))); // Clone for simultaneous set
            saveStateToDB();
            this.render();
        },
        uploadImg(qIdx, cIdx, e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (ev) => {
                if (cIdx === -1) {
                    appData.questions.p1[qIdx].qImg = ev.target.result;
                    appData.questions.p2[qIdx].qImg = ev.target.result;
                } else {
                    if (!appData.questions.p1[qIdx].imgs) appData.questions.p1[qIdx].imgs = ["","","",""];
                    if (!appData.questions.p2[qIdx].imgs) appData.questions.p2[qIdx].imgs = ["","","",""];
                    appData.questions.p1[qIdx].imgs[cIdx] = ev.target.result;
                    appData.questions.p2[qIdx].imgs[cIdx] = ev.target.result;
                }
                await saveStateToDB();
                editor.render();
            };
            reader.readAsDataURL(file);
        }
    };

    window.onload = async () => {
        try {
            await initDB();
            await loadStateFromDB();
        } catch (e) {
            console.log("Offline mode: IndexedDB not available, falling back to local storage.", e);
        }
        
        // Setup slider initial values
        document.getElementById('vol-slider').value = appData.settings.vol;
        
        // Auto-load relative backgrounds and music if present in workspace directories
        audio.autoLoadBGM();
        app.showScreen('screen-menu');
    };
</script>
</body>
</html>
